<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Estante</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>📚 Minha Estante</h1>
    </header>

    <div class="container">
        <!-- Formulário de Cadastro/Edição -->
        <section class="form-section">
            <h2 id="form-titulo">Adicionar Novo Livro</h2>
            <form id="form-livro">
                <input type="hidden" id="livro-id">
                
                <div class="form-group">
                    <label for="titulo">Título do Livro:</label>
                    <input type="text" id="titulo" required placeholder="Ex: O Senhor dos Anéis">
                </div>
                
                <div class="form-group">
                    <label for="autor">Autor:</label>
                    <input type="text" id="autor" required placeholder="Ex: J.R.R. Tolkien">
                </div>

                <div class="form-group">
                    <label for="paginas">Quantidade de Páginas (Opcional):</label>
                    <input type="number" id="paginas" placeholder="Ex: 320" min="0">
                </div>

                <div class="form-group">
                    <label for="ano">Ano de Publicação (Opcional):</label>
                    <input type="number" id="ano" placeholder="Ex: 1954" min="0">
                </div>
                
                <div class="form-group">
                    <label for="status">Status:</label>
                    <select id="status">
                        <option value="Não Lido">Não Lido</option>
                        <option value="Lendo">Lendo</option>
                        <option value="Lido">Lido</option>
                    </select>
                </div>

                <!-- Campo de Avaliação (Escondido por padrão) -->
                <div class="form-group" id="div-avaliacao" style="display: none;">
                    <label for="avaliacao">Avaliação (1 a 5 estrelas):</label>
                    <input type="number" id="avaliacao" min="1" max="5" placeholder="Nota de 1 a 5">
                </div>
                
                <button type="submit" id="btn-salvar">Salvar Livro</button>
                <button type="button" id="btn-cancelar" style="display:none; background-color:#95a5a6;">Cancelar Edição</button>
            </form>
        </section>

        <!-- Lista de Livros -->
        <section class="list-section">
            <h2>Meus Livros</h2>
            
            <!-- Barra de Pesquisa -->
            <div style="margin-bottom: 15px;">
                <input type="text" id="campo-pesquisa" placeholder="🔍 Pesquisar por título ou autor..." style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #ccc;">
            </div>

            <!-- Tabela -->
            <table id="tabela-livros">
                <thead>
                    <tr>
                        <th onclick="ordenar('titulo')">Título ↕️</th>
                        <th onclick="ordenar('autor')">Autor ↕️</th>
                        <th>Páginas</th>
                        <th>Ano</th>
                        <th onclick="ordenar('status')">Status ↕️</th>
                        <th>Nota</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="lista-corpo">
                    <!-- Injetado pelo JavaScript -->
                </tbody>
            </table>
        </section>
    </div>

    <!-- Modais de Notificação (Essenciais para o JS não quebrar) -->
    <div class="modal-overlay" id="modal-mensagem">
        <div class="modal-content">
            <p id="modal-texto"></p>
            <button onclick="fecharModalMensagem()" style="background-color: #3498db; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer;">OK</button>
        </div>
    </div>

    <div class="modal-overlay" id="modal-confirmacao">
        <div class="modal-content">
            <p>Tem certeza que deseja excluir este livro?</p>
            <button id="btn-confirmar-sim" style="background-color: #e74c3c; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer;">Excluir</button>
            <button onclick="fecharModalConfirmacao()" style="background-color: #95a5a6; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer;">Cancelar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
