<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Estante - Gestão de Livros</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Minha Estante</h1>
            <p>Gerencie seus livros de forma simples e rápida.</p>
        </header>

        <section class="form-section">
            <h2 id="form-titulo">Adicionar Novo Livro</h2>
            <form id="form-livro">
                <!-- Campo oculto para guardar o ID durante a edição -->
                <input type="hidden" id="livro-id">
                
                <div class="form-group">
                    <label for="titulo">Título do Livro:</label>
                    <input type="text" id="titulo" required placeholder="Ex: O Senhor dos Anéis">
                </div>
                
                <div class="form-group">
                    <label for="autor">Autor:</label>
                    <input type="text" id="autor" required placeholder="Ex: J.R.R. Tolkien">
                </div>

                <div class="form-group">
                    <label for="paginas">Quantidade de Páginas (Opcional):</label>
                    <input type="number" id="paginas" min="0" placeholder="Ex: 320">
                </div>

                <div class="form-group">
                    <label for="ano">Ano de Publicação (Opcional):</label>
                    <input type="number" id="ano" min="0" placeholder="Ex: 1954">
                </div>
                
                <div class="form-group">
                    <label for="status">Status:</label>
                    <select id="status">
                        <option value="Não Lido">Não Lido</option>
                        <option value="Lendo">Lendo</option>
                        <option value="Lido">Lido</option>
                    </select>
                </div>
                
                <button type="submit" id="btn-salvar">Salvar Livro</button>
                <button type="button" id="btn-cancelar" style="display:none; background-color:#95a5a6;">Cancelar Edição</button>
            </form>
        </section>

        <section class="list-section">
            <h2>Meus Livros</h2>
            <div style="margin-bottom: 15px;">
                <input type="text" id="campo-pesquisa" placeholder="🔍 Pesquisar por título ou autor..." style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #ccc;">
            </div>
            <table id="tabela-livros">
                <thead>
                    <tr>
                        <th>Título</th>
                        <th>Autor</th>
                        <th>Páginas</th>
                        <th>Ano</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="lista-corpo">
                </tbody>
            </table>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
